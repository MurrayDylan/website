services:

  postgres:
    image: postgres:17
    container_name: website-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - website

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: website-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      MEDIA_STORAGE_PATH: /app/media-storage

    volumes:
      - media_data:/app/media-storage

    ports:
      - "8080:8080"

    networks:
      - website

volumes:
  postgres_data:
  media_data:

networks:
  website:
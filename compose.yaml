services:

  postgres:
    image: postgres:17
    container_name: website-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - website-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: website-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      MEDIA_STORAGE_PATH: /app/media-storage
    depends_on:
      - postgres
    volumes:
      - media-storage:/app/media-storage
    networks:
      - website-network

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: website-frontend
      restart: unless-stopped
      depends_on:
        - backend
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./certs:/etc/nginx/certs:ro
      networks:
        - website-network

volumes:
  postgres-data:
  media-storage:

networks:
  website-network:
    driver: bridge